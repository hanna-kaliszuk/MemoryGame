{% extends "game/base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}

<div class="auth-container">
    <h1>Log in</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Log in</button>
    </form>

    <p class="auth-link">
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </p>
</div>

{% endblock %}
